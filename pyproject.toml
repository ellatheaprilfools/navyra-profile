[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navyra-profile"
version = "0.1.0.dev0"
description = "Measure how semantically repetitive your LLM traffic is"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Navyra Ltd"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
full = ["sentence-transformers>=2.2", "matplotlib>=3.7"]
dev = ["faker>=20.0"]

[project.scripts]
navyra-profile = "navyra_profile.cli:main"
